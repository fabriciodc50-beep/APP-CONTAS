<style>
  body { margin:0; background:#0a0e16; color:#e8edf7; font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#60a5fa; text-decoration:none; }
  a:hover { color:#93c5fd; }
  button { font-family:inherit; }
  input, select, textarea { font-family:inherit; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#232d40; border-radius:8px; }
  @keyframes om-up { from { transform:translateY(18px); opacity:0 } to { transform:translateY(0); opacity:1 } }
  @keyframes om-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes om-pulse { 0% { box-shadow:0 0 0 0 rgba(59,130,246,.45) } 70% { box-shadow:0 0 0 26px rgba(59,130,246,0) } 100% { box-shadow:0 0 0 0 rgba(59,130,246,0) } }
  @keyframes om-grow { from { transform:scaleY(.15); opacity:.3 } to { transform:scaleY(1); opacity:1 } }
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">



<div style="min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#132038 0%,#0a0e16 60%);padding:0 0 132px">
  <div style="max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(14px,3vw,28px) 0">

    <sc-if value="{{ ehInicio }}" hint-placeholder-val="{{ true }}">
    <div data-screen-label="Início" style="animation:om-fade .25s ease">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px">
        <div>
          <div style="font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8b97ad">{{ dataHoje }}</div>
          <div style="font-size:clamp(24px,4.4vw,32px);font-weight:800;letter-spacing:-.02em;margin-top:6px">{{ saudacao }}</div>
        </div>
        <div style="width:44px;height:44px;border-radius:14px;background:#131926;border:1px solid #1f2937;display:grid;place-items:center;font-weight:800;color:#f59e0b;flex:none">R</div>
      </div>

      <sc-if value="{{ temAlerta }}" hint-placeholder-val="{{ false }}">
        <div sc-camel-on-click="{{ verAtencao }}" style="display:flex;align-items:center;gap:12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:16px;padding:14px 16px;margin-bottom:16px;cursor:pointer" style-hover="background:rgba(239,68,68,.16)">
          <div style="width:34px;height:34px;border-radius:11px;background:rgba(239,68,68,.2);display:grid;place-items:center;flex:none">
            <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5"></path><path d="M12 17h.01"></path><path d="M10.3 4.3 2.6 18a1.8 1.8 0 0 0 1.6 2.7h15.6a1.8 1.8 0 0 0 1.6-2.7L13.7 4.3a1.8 1.8 0 0 0-3.4 0Z"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px;color:#fecaca">{{ alertaTitulo }}</div>
            <div style="font-size:13px;color:#f8a5a5;margin-top:2px">{{ alertaSub }}</div>
          </div>
          <span style="font-size:13px;font-weight:700;color:#fca5a5;white-space:nowrap">Ver ›</span>
        </div>
      </sc-if>

      <div style="background:linear-gradient(150deg,#16243d 0%,#131926 55%);border:1px solid #24344f;border-radius:24px;padding:clamp(20px,3.4vw,28px);margin-bottom:14px">
        <div style="font-size:14px;font-weight:600;color:#9fb0c9">Falta pagar em agosto</div>
        <div style="display:flex;align-items:baseline;gap:10px;margin:8px 0 4px">
          <span style="font-size:clamp(36px,7vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1">{{ faltaPagar }}</span>
        </div>
        <div style="font-size:14px;color:#8b97ad">de {{ totalMes }} previstos · {{ qtdPendentes }} contas em aberto</div>
        <div style="height:10px;border-radius:99px;background:#0e1524;margin-top:18px;overflow:hidden;border:1px solid #1f2937">
          <div style="height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#60a5fa);width:{{ pctPago }}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:10px">
          <span style="color:#22c55e">{{ jaPago }} já pago</span>
          <span style="color:#8b97ad">{{ pctPago }}% do mês</span>
        </div>
      </div>

      <div style="font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8b97ad;margin:22px 0 10px">Custo do mês · estrutural</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
        <div style="background:#131926;border:1px solid #1f2937;border-left:3px solid #3b82f6;border-radius:18px;padding:16px 18px">
          <div style="font-size:13px;font-weight:700;color:#93c5fd">Fixas</div>
          <div style="font-size:clamp(20px,3.4vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:6px">{{ somaFixa }}</div>
          <div style="font-size:12px;color:#8b97ad;margin-top:4px">todo mês, valor igual</div>
        </div>
        <div style="background:#131926;border:1px solid #1f2937;border-left:3px solid #f59e0b;border-radius:18px;padding:16px 18px">
          <div style="font-size:13px;font-weight:700;color:#fcd34d">Variáveis</div>
          <div style="font-size:clamp(20px,3.4vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:6px">{{ somaVariavel }}</div>
          <div style="font-size:12px;color:#8b97ad;margin-top:4px">todo mês, valor muda</div>
        </div>
        <div style="background:#0f1725;border:1px dashed #2b3648;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center">
          <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b97ad">Soma estrutural</div>
          <div style="font-size:clamp(20px,3.4vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:6px;color:#e8edf7">{{ somaEstrutural }}</div>
        </div>
      </div>

      <div style="font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8b97ad;margin:22px 0 10px">Flexível · dá pra economizar</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">

    compile: function (markupString) {
      const tpl = document.createElement('div');
      tpl.innerHTML = markupString;
      return tpl;
    },
    // render: recebe o template DOM e o scope de dados, devolve HTML e reseta handlers
    render: function (templateEl, scope) {
      HANDLERS = {};
      HKEY = 0;
      return processChildren(templateEl, scope);
    },
    // liga os eventos no container renderizado
    bindEvents: function (container) {
      container.querySelectorAll('[data-click]').forEach(function (el) {
        const key = el.getAttribute('data-click');
        el.addEventListener('click', function (e) {
          if (HANDLERS[key]) HANDLERS[key](e);
        });
      });
      container.querySelectorAll('[data-change]').forEach(function (el) {
        const key = el.getAttribute('data-change');
        el.addEventListener('input', function (e) {
          if (HANDLERS[key]) HANDLERS[key](e);
        });
      });
      // hover: aplica estilos extras ao passar o mouse
      container.querySelectorAll('[data-hover]').forEach(function (el) {
        const hover = el.getAttribute('data-hover');
        const orig = el.getAttribute('style') || '';
        el.addEventListener('mouseenter', function () {
          el.setAttribute('style', orig + ';' + hover);
        });
        el.addEventListener('mouseleave', function () {
          el.setAttribute('style', orig);
        });
      });
    },
  };
})();

<script>
// ============================================================
// Base do app — substitui o runtime fechado do Claude Design.
// Dá setState + re-render + PERSISTÊNCIA REAL no aparelho.
// ============================================================

const STORAGE_KEY = 'painel_contas_dados_v1';
const CONFIG_KEY = 'painel_contas_config_v1';

// Carrega o que foi salvo no aparelho (ou null se nunca salvou).
function carregarSalvo() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function salvarNoAparelho(dados) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
    return true;
  } catch (e) {
    return false;
  }
}

function carregarConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function salvarConfig(cfg) {
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  } catch (e) {}
}

class DCLogic {
  constructor() {
    // props = configurações ajustáveis (equivalente ao painel do Design)
    this.props = Object.assign(
      { esconderValores: false, corDestaque: '#3b82f6', diasAviso: 3 },
      carregarConfig()
    );
    this._mounted = false;
  }

  // Chamado uma vez pra ligar o app ao container e ao template.
  mount(container, templateEl) {
    this._container = container;
    this._template = templateEl;
    this._mounted = true;
    this.render();
  }

  setState(patch) {
    Object.assign(this.state, patch);
    // Persiste as partes duráveis (contas, categorias, ajustes) a cada mudança.
    this._persistir();
    this.render();
  }

  _persistir() {
    // Só guarda o que é dado real do usuário (não estado de tela como overlay/aba).
    const s = this.state;
    salvarNoAparelho({
      contas: s.contas,
      cats: s.cats,
      aviso: s.aviso,
      hora: s.hora,
      tg: s.tg,
    });
  }

  // Salva as configurações (props) — cor, esconder valores, dias de aviso.
  setProp(k, v) {
    this.props[k] = v;
    salvarConfig(this.props);
    this.render();
  }

  render() {
    if (!this._mounted) return;
    const scope = this.renderVals();
    const html = window.TemplateEngine.render(this._template, scope);
    this._container.innerHTML = html;
    window.TemplateEngine.bindEvents(this._container);
  }
}

</script>

      // categoria válida (só pessoal/casa/empresa no topo); sobe a cadeia de pais até a raiz
      let catRaiz = this._raizCategoria(cat, dados.categorias || []);
      return {
        id: c.id ? String(c.id) : ('imp' + Date.now() + i),
        titulo: (c.titulo || '').trim() || 'Sem título',
        desc: (c.desc || c.descricao || '').trim(),
        valor: Number(c.valor) || 0,
        venc: venc,
        cat: catRaiz,
        tipo: tipo,
        forma: c.forma || (c.formaPagamento ? this._formaLabel(c.formaPagamento) : 'Pix'),
        banco: c.banco || '',

    });
  }
  // Sobe a cadeia de categoria-pai até achar pessoal/casa/empresa.
  _raizCategoria(cat, categorias) {
    const raizes = { pessoal: 1, casa: 1, empresa: 1 };
    let atual = cat;
    for (let i = 0; i < 10; i++) {
      if (raizes[atual]) return atual;
      const def = categorias.find((x) => x.id === atual);
      if (!def) break;
      // reconhece pelo nome
      const nome = (def.nome || '').toLowerCase().trim();
      if (nome.indexOf('casa') >= 0) return 'casa';
      if (nome.indexOf('empresa') >= 0 || nome.indexOf('estúdio') >= 0 || nome.indexOf('estudio') >= 0) return 'empresa';
      if (nome === 'pessoal') return 'pessoal';
      if (!def.paiId) break;
      atual = def.paiId;
    }
    return raizes[atual] ? atual : 'pessoal';
  }
  _formaLabel(f) {
    const m = { pix: 'Pix', boleto: 'Boleto', credito: 'Cartão', debito: 'Débito automático', dinheiro: 'Dinheiro', carteira: 'Dinheiro' };
    return m[f] || 'Pix';

  _saudacao() {

    return nome ? (parte + ', ' + nome) : parte;
  }

    };
  }
}
